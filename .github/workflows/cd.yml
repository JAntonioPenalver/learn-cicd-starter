name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build production app
      run: ./scripts/buildprod.sh

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and Push Docker Image
      run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-cicd-505615/notely-ar-repo/notely:latest .

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy notely \
          --image us-central1-docker.pkg.dev/notely-cicd-505615/notely-ar-repo/notely:latest \
          --region us-central1 \
          --allow-unauthenticated \
          --project notely-cicd-505615 \
          --max-instances=4 \
          --set-env-vars="DB_URL=dummy"
